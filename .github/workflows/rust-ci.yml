name: Reusable Rust Workspace CI

on:
  workflow_call:
    inputs:
      repo:
        description: "Name of the repository under test (e.g. core, router, spatial)"
        required: true
        type: string
      siblings:
        description: "Space-separated list of sibling repos to check out alongside this repo"
        required: false
        default: ""
        type: string

jobs:
  check:
    name: "Rust CI (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Install Linux graphics/window system headers (if spatial/nayuta)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libwayland-dev libxkbcommon-dev libvulkan-dev

      - name: Checkout target repository into sibling layout
        uses: actions/checkout@v4
        with:
          path: ${{ inputs.repo }}
          lfs: true

      - name: Checkout required sibling repositories
        if: inputs.siblings != ''
        shell: bash
        run: |
          for sib in ${{ inputs.siblings }}; do
            echo "Cloning sibling repository: $sib"
            git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY_OWNER}/${sib}.git" "${sib}"
          done

      - name: Configure shared Cargo target directory
        shell: bash
        run: |
          mkdir -p .cargo
          printf '[build]\ntarget-dir = "target"\n' > .cargo/config.toml

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ inputs.repo }} -> target"

      - name: Check formatting (cargo fmt)
        working-directory: ${{ inputs.repo }}
        run: cargo fmt --all -- --check

      - name: Lint with Clippy (cargo clippy)
        working-directory: ${{ inputs.repo }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit & integration tests (cargo test)
        working-directory: ${{ inputs.repo }}
        run: cargo test --workspace

      - name: Run Architectural Fitness Guards
        working-directory: ${{ inputs.repo }}
        shell: bash
        env:
          REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail

          check_guard() {
            local guard_id="$1"
            local pattern="$2"
            local pass_msg="$3"
            local fail_msg="$4"
            shift 4

            local tree_out
            tree_out="$("$@")"

            local matches=""
            local grep_status=0
            matches="$(printf '%s\n' "$tree_out" | grep -E -- "$pattern")" || grep_status=$?

            if [[ "$grep_status" -eq 0 ]]; then
              echo "::error::${guard_id} VIOLATION in ${REPO}: ${fail_msg}"
              printf '%s\n' "$matches" >&2
              exit 1
            elif [[ "$grep_status" -gt 1 ]]; then
              echo "::error::${guard_id}: grep failed with exit status ${grep_status}"
              exit "$grep_status"
            fi

            echo "[PASS] ${guard_id}: ${pass_msg}"
          }

          case "$REPO" in
            core)
              check_guard \
                "GUARD-01" \
                '(^|[[:space:]])(axum|reqwest|hyper|wgpu|winit|egui)[[:space:]]|tokio v[^[]*\[[^]]*\brt\b' \
                "nayuta-core-* is free of HTTP/GPU/tokio-rt dependencies." \
                "forbidden dependency detected" \
                cargo tree -p nayuta-core-telemetry -e normal -f "{p} [{f}]"
              ;;
            vrm)
              check_guard \
                "GUARD-02" \
                '(^|[[:space:]])(wgpu|winit|egui|nayuta-shader-)' \
                "nayuta-vrm-* is 100% CPU-only." \
                "GPU/window dependency detected" \
                cargo tree --workspace -e normal
              ;;
            agent)
              check_guard \
                "GUARD-03" \
                '(^|[[:space:]])(nayuta-router-|axum|wgpu|winit)' \
                "nayuta-agent-* is decoupled from nayuta-router-*." \
                "direct router/GPU dependency detected" \
                cargo tree --workspace -e normal
              ;;
            spatial)
              check_guard \
                "GUARD-05" \
                '^(wgpu|winit) v' \
                "single unified version of wgpu & winit in spatial." \
                "duplicate wgpu or winit versions detected" \
                cargo tree -d
              ;;
            nayuta)
              check_guard \
                "GUARD-04" \
                '(^|[[:space:]])(wgpu|winit|egui|nayuta-spatial-|nayuta-shader-)' \
                "nayuta-headless is 100% GPU-free (VPS ready)." \
                "GPU/window dependency detected" \
                cargo tree -p nayuta-headless -e normal
              check_guard \
                "GUARD-05" \
                '^(wgpu|winit) v' \
                "single unified version of wgpu & winit in nayuta." \
                "duplicate wgpu or winit versions detected" \
                cargo tree -d
              ;;
            *)
              echo "No architectural fitness guards configured for repo '$REPO'."
              ;;
          esac
