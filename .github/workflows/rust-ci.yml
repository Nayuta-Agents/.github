name: Reusable Rust Workspace CI

on:
  workflow_call:
    inputs:
      repo:
        description: "Name of the Rust repository under test"
        required: true
        type: string
      siblings:
        description: "Space-separated sibling repositories required by this workspace"
        required: false
        default: ""
        type: string
      integration-ref:
        description: "Explicit branch shared by sibling repositories and CI helpers"
        required: false
        default: "dev"
        type: string
      test-assets:
        description: "Run ignored integration tests with checked-out LFS assets"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  check:
    name: "Rust CI (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Validate sibling layout inputs
        shell: bash
        env:
          REPO: ${{ inputs.repo }}
          SIBLINGS: ${{ inputs.siblings }}
          INTEGRATION_REF: ${{ inputs.integration-ref }}
        run: |
          set -euo pipefail
          case "$REPO" in
            core|shaders|vrm|router|agent|sdk|spatial|nayuta) ;;
            *) printf 'Invalid Rust repository: %s\n' "$REPO" >&2; exit 2 ;;
          esac
          read -r -a siblings <<< "$SIBLINGS"
          for sib in "${siblings[@]}"; do
            case "$sib" in
              core|shaders|vrm|router|agent|sdk|spatial|nayuta|assets) ;;
              *) printf 'Invalid sibling repository: %s\n' "$sib" >&2; exit 2 ;;
            esac
          done
          git check-ref-format --branch "$INTEGRATION_REF" >/dev/null

      - name: Install Linux graphics and window headers
        if: runner.os == 'Linux' && (inputs.repo == 'spatial' || inputs.repo == 'nayuta')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libwayland-dev libxkbcommon-dev libvulkan-dev

      - name: Checkout target repository into sibling layout
        uses: actions/checkout@v4
        with:
          path: ${{ inputs.repo }}
          lfs: true

      - name: Checkout shared verification helpers
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/.github
          ref: ${{ inputs.integration-ref }}
          path: .github

      - name: Checkout required sibling repositories
        if: inputs.siblings != ''
        shell: bash
        env:
          SIBLINGS: ${{ inputs.siblings }}
          INTEGRATION_REF: ${{ inputs.integration-ref }}
        run: |
          set -euo pipefail
          read -r -a siblings <<< "$SIBLINGS"
          for sib in "${siblings[@]}"; do
            printf 'Cloning sibling repository: %s (%s)\n' "$sib" "$INTEGRATION_REF"
            git clone --depth 1 --branch "$INTEGRATION_REF" "https://github.com/${GITHUB_REPOSITORY_OWNER}/${sib}.git" "$sib"
            if [[ -f "$sib/.gitattributes" ]]; then
              git -C "$sib" lfs install --local
              git -C "$sib" lfs pull
            fi
          done

      - name: Configure shared Cargo target directory
        shell: bash
        run: |
          mkdir -p .cargo
          printf '[build]\ntarget-dir = "target"\n' > .cargo/config.toml

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ inputs.repo }} -> target"

      - name: Test Bash verification fixtures
        shell: bash
        run: bash .github/scripts/test-verification.sh

      - name: Test PowerShell verification fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ./.github/scripts/test-verification.ps1'

      - name: Check formatting
        working-directory: ${{ inputs.repo }}
        shell: bash
        run: |
          source ../.github/scripts/verification.sh
          checked_cargo fmt --all -- --check

      - name: Lint with Clippy and reject Cargo warnings
        working-directory: ${{ inputs.repo }}
        shell: bash
        run: |
          source ../.github/scripts/verification.sh
          checked_cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit and integration tests
        working-directory: ${{ inputs.repo }}
        shell: bash
        run: |
          source ../.github/scripts/verification.sh
          checked_cargo test --workspace

      - name: Run architectural fitness guards
        shell: bash
        env:
          REPO: ${{ inputs.repo }}
        run: |
          source .github/scripts/verification.sh
          run_architectural_guards "$REPO" "$GITHUB_WORKSPACE"

      - name: Run LFS asset integration tests
        if: inputs.test-assets
        working-directory: ${{ inputs.repo }}
        shell: bash
        env:
          REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          source ../.github/scripts/verification.sh
          git -C ../assets lfs fsck
          case "$REPO" in
            vrm) checked_cargo test -p nayuta-vrm-animation -- --ignored ;;
            nayuta) checked_cargo test -p nayuta-desktop -- --ignored ;;
            *) printf 'Asset tests are not configured for %s\n' "$REPO" >&2; exit 2 ;;
          esac
